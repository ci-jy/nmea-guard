[project]
name = "nmea-guard-tests"
version = "0.2.0"
description = "Python test harness for the nmea-guard C++ parser"
requires-python = ">=3.10"
dependencies = [
    "pynmea2>=1.19",
    "pytest>=7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tools", "scripts"]
addopts = "-ra"
